<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo — Legal &amp; Support</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #fffdf9;
      --text: #2c2824;
      --muted: #6b6560;
      --accent: #8b7355;
      --border: rgba(44, 40, 36, 0.1);
      --max: 560px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.06em; margin: 0 0 0.5rem; }
    .tagline { color: var(--muted); margin: 0 0 2.5rem; font-weight: 300; }
    .links { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: var(--max); }
    a.card {
      display: block;
      padding: 1.1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--accent);
      text-decoration: none;
      font-size: 1rem;
      transition: border-color 0.15s;
    }
    a.card:hover { border-color: var(--accent); }
    a.card span { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Echo</h1>
  <p class="tagline">温柔记录此刻与回响 · A gentle local-first journal</p>

  <div class="links">
    <a class="card" href="privacy.html">
      Privacy Policy
      <span>隐私政策</span>
    </a>
    <a class="card" href="terms.html">
      Terms of Service
      <span>服务条款</span>
    </a>
    <a class="card" href="mailto:vivida51888@gmail.com">
      Contact
      <span>vivida51888@gmail.com</span>
    </a>
  </div>

  <footer>
    Echo v1.0.0 · Package com.vivida8.echo
  </footer>
</body>
</html>
